<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-labelledby="chain-title chain-desc">
  <title id="chain-title">Theming token flow as a chain</title>
  <desc id="chain-desc">Custom branding sets --oscd-theme-* for the host. The host publishes --oscd-* to plugins and libraries.</desc>
  <defs>
    <marker id="chain-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#586e75"/>
    </marker>
  </defs>
  <rect width="900" height="200" fill="#ffffff"/>
  <text x="450" y="32" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#073642">Chain (my assumption)</text>

  <rect x="24" y="72" width="220" height="64" rx="8" fill="#e8f6f4" stroke="#2aa198" stroke-width="2"/>
  <text x="134" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#073642">Custom branding</text>

  <line x1="244" y1="104" x2="356" y2="104" stroke="#586e75" stroke-width="2" marker-end="url(#chain-arrow)"/>
  <text x="300" y="92" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#073642">--oscd-theme-*</text>

  <rect x="364" y="72" width="140" height="64" rx="8" fill="#e8f4fb" stroke="#268bd2" stroke-width="2"/>
  <text x="434" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#073642">Host</text>

  <line x1="504" y1="104" x2="616" y2="104" stroke="#586e75" stroke-width="2" marker-end="url(#chain-arrow)"/>
  <text x="560" y="92" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Consolas, monospace" font-size="12" fill="#073642">--oscd-*</text>

  <rect x="624" y="72" width="252" height="64" rx="8" fill="#eeedf7" stroke="#6c71c4" stroke-width="2"/>
  <text x="750" y="110" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#073642">Plugin + libraries</text>

  <text x="450" y="176" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#586e75">Host publishes --oscd-* as the API that plugins and libraries consume</text>
</svg>
