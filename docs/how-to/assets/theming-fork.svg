<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 520" width="1080" height="520" role="img" aria-labelledby="layers-title layers-desc">
  <title id="layers-title">Custom branding fans out to host, plugins, and libraries</title>
  <desc id="layers-desc">Custom branding sets --oscd-theme-*. Host and plugins both read --oscd-theme-* independently. Libraries then read their own prefixes: oscd-ui reads --oscd-* (planned --oscd-ui-*), Google Material reads --md-sys-* / --mwc-*, other stacks read their own tokens.</desc>
  <defs>
    <marker id="fork-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#586e75"/>
    </marker>
  </defs>
  <rect width="1080" height="520" fill="#ffffff"/>
  <text x="540" y="32" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#073642">Custom branding fans out to host, plugins, and libraries</text>

  <rect x="390" y="52" width="300" height="72" rx="8" fill="#e8f6f4" stroke="#2aa198" stroke-width="2"/>
  <text x="540" y="82" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#073642">Custom branding / distro</text>
  <text x="540" y="104" text-anchor="middle" font-size="12" fill="#073642">
    <tspan font-family="ui-sans-serif, system-ui, sans-serif">Set </tspan>
    <tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace">--oscd-theme-*</tspan>
  </text>

  <line x1="540" y1="124" x2="540" y2="156" stroke="#586e75" stroke-width="2"/>
  <path d="M160 176 L160 156 L720 156 L720 176" fill="none" stroke="#586e75" stroke-width="2"/>
  <line x1="160" y1="176" x2="160" y2="196" stroke="#586e75" stroke-width="2" marker-end="url(#fork-arrow)"/>
  <line x1="720" y1="176" x2="720" y2="196" stroke="#586e75" stroke-width="2" marker-end="url(#fork-arrow)"/>

  <rect x="55" y="204" width="210" height="72" rx="8" fill="#e8f4fb" stroke="#268bd2" stroke-width="2"/>
  <text x="160" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#073642">Host</text>
  <text x="160" y="256" text-anchor="middle" font-size="12" fill="#073642">
    <tspan font-family="ui-sans-serif, system-ui, sans-serif">Read </tspan>
    <tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace">--oscd-theme-*</tspan>
  </text>

  <rect x="615" y="204" width="210" height="72" rx="8" fill="#eeedf7" stroke="#6c71c4" stroke-width="2"/>
  <text x="720" y="234" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#073642">Plugin</text>
  <text x="720" y="256" text-anchor="middle" font-size="12" fill="#073642">
    <tspan font-family="ui-sans-serif, system-ui, sans-serif">Read </tspan>
    <tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace">--oscd-theme-*</tspan>
  </text>

  <line x1="160" y1="276" x2="160" y2="332" stroke="#586e75" stroke-width="2" marker-end="url(#fork-arrow)"/>

  <line x1="720" y1="276" x2="720" y2="288" stroke="#586e75" stroke-width="2"/>
  <path d="M490 288 L490 308 M490 288 L945 288 L945 308" fill="none" stroke="#586e75" stroke-width="2"/>
  <line x1="490" y1="308" x2="490" y2="332" stroke="#586e75" stroke-width="2" marker-end="url(#fork-arrow)"/>
  <line x1="720" y1="288" x2="720" y2="332" stroke="#586e75" stroke-width="2" marker-end="url(#fork-arrow)"/>
  <line x1="945" y1="308" x2="945" y2="332" stroke="#586e75" stroke-width="2" marker-end="url(#fork-arrow)"/>

  <rect x="50" y="340" width="220" height="96" rx="8" fill="#f4f6f7" stroke="#586e75" stroke-width="2"/>
  <text x="160" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#073642">Host components</text>
  <text x="160" y="404" text-anchor="middle" font-size="12" fill="#073642">
    <tspan font-family="ui-sans-serif, system-ui, sans-serif">Read </tspan>
    <tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace">--oscd-*</tspan>
  </text>

  <rect x="390" y="340" width="200" height="96" rx="8" fill="#f4f6f7" stroke="#586e75" stroke-width="2"/>
  <text x="490" y="368" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#073642">oscd-ui</text>
  <text x="490" y="390" text-anchor="middle" font-size="12" fill="#073642">
    <tspan font-family="ui-sans-serif, system-ui, sans-serif">Read </tspan>
    <tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace">--oscd-*</tspan>
  </text>
  <text x="490" y="418" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" font-style="italic" fill="#586e75">future: --oscd-ui-*</text>

  <rect x="610" y="340" width="220" height="96" rx="8" fill="#f4f6f7" stroke="#586e75" stroke-width="2"/>
  <text x="720" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#073642">Google Material lib</text>
  <text x="720" y="404" text-anchor="middle" font-size="12" fill="#073642">
    <tspan font-family="ui-sans-serif, system-ui, sans-serif">Read </tspan>
    <tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace">--md-sys-*, --mwc-*</tspan>
  </text>

  <rect x="850" y="340" width="190" height="96" rx="8" fill="#f4f6f7" stroke="#586e75" stroke-width="2"/>
  <text x="945" y="380" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#073642">Others</text>
  <text x="945" y="404" text-anchor="middle" font-size="12" fill="#073642">
    <tspan font-family="ui-sans-serif, system-ui, sans-serif">Read </tspan>
    <tspan font-family="ui-monospace, SFMono-Regular, Consolas, monospace">--others-*</tspan>
  </text>

  <text x="540" y="480" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#586e75">Host and plugin each map --oscd-theme-* into the prefixes their UI stacks read</text>
</svg>
